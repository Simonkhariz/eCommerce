# Shop.co on one server (deploy/oracle/setup.sh fills in __HOST__, __PHPV__ and __APP__).
# certbot adds the https part to the public block below and redirects http to https.

# The PHP API: reachable only from this server (the storefront calls it), never from outside.
server {
    listen 127.0.0.1:8080;
    root __APP__/backend/public;
    index index.php;
    client_max_body_size 10m;
    server_tokens off;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php__PHPV__-fpm.sock;
        fastcgi_read_timeout 130s;
    }
    location ~ /\. {
        deny all;
    }
}

# The shop, as visitors see it.
server {
    listen 80;
    listen [::]:80;
    server_name __HOST__;
    client_max_body_size 10m;
    server_tokens off;

    # The first administrator is created once, through an SSH tunnel (README), never from the
    # internet: on a new empty database, whoever reached this page first would own the shop.
    # Any capitals and trailing slashes too: the storefront's routes ignore both, so an exact
    # match could be stepped around with /API/v1/setup. /api/v1/setup/status stays open.
    location ~* ^/api/v1/setup/*$ {
        return 403;
    }
    location ~* ^/admin/setup/*$ {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # The visitor's real address, replacing anything the visitor sent: rate limits and
        # sign-in protection depend on it (TRUSTED_PROXIES=127.0.0.1 in backend/.env).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 130s;
        # Live payment status (when SSE_ENABLED=true) must reach the browser as it happens.
        proxy_buffering off;
    }
}
